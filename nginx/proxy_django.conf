# Shared reverse-proxy settings (included from every location in nginx.conf).
# Buffering and timeout directives are NOT here: each location sets its own, because the
# upload/download routes need very different values from ordinary pages.
proxy_pass http://django-web:8000;

proxy_http_version 1.1;
proxy_set_header Host              $host;
# These are OVERWRITTEN (not appended) so a client can't spoof them. Django honours
# X-Real-IP only when the TCP peer is this nginx container (see vault/audit.py).
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;
