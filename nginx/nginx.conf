worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                       # don't advertise the nginx version
    sendfile      on;

    # --- Rate limiting ------------------------------------------------------
    # Login endpoints: 30 requests/minute per IP (+ burst 10) stops floods. Django adds its
    # own stricter failed-attempt lockout (5 failures / 15 min) on top (defence in depth).
    limit_req_zone $binary_remote_addr zone=login:10m   rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_status 429;

    # --- HTTP -> HTTPS redirect --------------------------------------------
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS --------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # TLS termination (self-signed cert from scripts/gen_certs.sh)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        # --- Security headers (set at server level; do NOT add add_header inside
        #     locations, nginx would then drop these inherited ones) ----------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "same-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Strict CSP: everything (JS and the locally built Tailwind CSS) is served from our own
        # origin, so no external hosts and no 'unsafe-inline' for scripts or styles.
        # (The upload progress bar sets element.style.width from JS; CSSOM changes are allowed.)
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
            always;

        # --- Defaults for ordinary pages: small bodies, short timeouts (anti-slowloris) ---
        client_max_body_size 1m;
        client_header_timeout 15s;
        client_body_timeout   30s;
        send_timeout          30s;
        keepalive_timeout     65s;

        # NOTE on the long timeouts below: client_body_timeout, proxy_send_timeout,
        # proxy_read_timeout and send_timeout are NOT totals. Each is the maximum IDLE gap
        # between two successive reads/writes. A slow but steady 1 GB transfer (hours) never
        # trips them; only a stalled connection does. They are long only on the two routes
        # that need it, so slow-body attacks on other URLs are cut off after 30 s.

        # Login pages: strict rate limit
        location ~ ^/(accounts|admin)/login/$ {
            limit_req zone=login burst=10 nodelay;
            include /etc/nginx/proxy_django.conf;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # UPLOAD (<= 1 GB, enforced here AND in Django). The body is streamed straight to
        # Django (no nginx temp file, so plaintext never lands on nginx's disk).
        location = /files/upload/ {
            limit_req zone=general burst=60 nodelay;
            client_max_body_size  1g;
            client_body_timeout   3600s;     # max idle gap while the browser sends the body
            proxy_request_buffering off;
            proxy_send_timeout    3600s;     # max idle gap while nginx writes to Gunicorn
            proxy_read_timeout    3600s;     # max wait for Gunicorn's reply after the last byte
            include /etc/nginx/proxy_django.conf;
        }

        # DOWNLOAD (streamed; Django verifies the whole file first, then sends it)
        location ~ "^/files/[0-9a-fA-F-]{36}/download/$" {
            limit_req zone=general burst=60 nodelay;
            proxy_buffering         off;     # pass bytes straight through, no nginx temp file
            proxy_max_temp_file_size 0;
            proxy_read_timeout      3600s;   # includes the up-front integrity pass (no bytes sent yet)
            send_timeout            3600s;   # max idle gap while writing to a slow client
            include /etc/nginx/proxy_django.conf;
        }

        location / {
            limit_req zone=general burst=60 nodelay;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            include /etc/nginx/proxy_django.conf;
        }
    }
}
