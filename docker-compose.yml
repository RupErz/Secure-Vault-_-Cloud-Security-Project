name: securevault

# Three containers, exactly as required:
#   mynginx    - the ONLY thing that publishes ports (80/443)
#   django-web - Gunicorn + Django, reachable only on the internal Docker network
#   db         - PostgreSQL, reachable only on the internal "backend" network
services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [backend]
    # NOTE: no "ports:" -> not reachable from the host or the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  django-web:
    build: ./app
    container_name: django-web
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      FILE_STORAGE_DIR: /data/files
      # Only the nginx container may supply the real client IP (X-Real-IP).
      TRUSTED_PROXY_HOSTS: mynginx
      # The master key is read from a Docker secret (a file under /run/secrets),
      # NOT from the image, NOT from the file volume, NOT from the database.
      MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [master_key]
    volumes:
      - file_data:/data/files        # private encrypted-file storage (named volume)
    networks: [backend, frontend]
    expose: ["8000"]                 # visible to other containers only, never published
    depends_on:
      db:
        condition: service_healthy
    # Container hardening
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz', headers={'Host':'localhost'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mynginx:
    image: nginx:1.27-alpine
    container_name: mynginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_django.conf:/etc/nginx/proxy_django.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [frontend]
    depends_on:
      django-web:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

networks:
  frontend: {}
  backend:
    internal: true                   # no route to the outside world at all

volumes:
  pg_data:
  file_data:

secrets:
  master_key:
    file: ./secrets/master_key.txt
